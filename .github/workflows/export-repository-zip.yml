name: Export Repository ZIP

on:
  push:
    branches: ["hardening/part-2-defense-in-depth"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create complete repository archive
        run: git archive --format=zip --output=qwen-api-complete-${GITHUB_SHA}.zip HEAD
      - name: Upload complete repository ZIP
        uses: actions/upload-artifact@v4
        with:
          name: qwen-api-complete-${{ github.sha }}
          path: qwen-api-complete-${{ github.sha }}.zip
          retention-days: 30
