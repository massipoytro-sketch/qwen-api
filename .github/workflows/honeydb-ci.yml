name: HoneyDB CI

on:
  push:
    branches: ["main", "hardening/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  honeydb:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: deception/honeydb
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: deception/honeydb/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Syntax check
        run: python -m py_compile app.py test_app.py

      - name: Run isolation tests
        env:
          HONEY_HASH_KEY: unit-test-honey-hash-key-0123456789-abcdef
        run: python -m unittest discover -s . -p 'test_*.py' -v
