name: Security API Smoke Bot

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Authorized deployment base URL"
        required: true
        default: "https://gainiren-security-api.onrender.com"
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Allow production deployment to settle
        if: github.event_name == 'push'
        run: sleep 60
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run safe smoke checks
        env:
          SECURITY_API_BASE_URL: ${{ inputs.base_url }}
        run: node scripts/security-smoke-bot.mjs
