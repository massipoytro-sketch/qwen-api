name: Security CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate
        env:
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVER_KEY: ci-placeholder-not-a-real-secret
        run: pnpm check

  analytics-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics/duckdb-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: analytics/duckdb-worker/requirements.txt

      - name: Install analytics worker dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Syntax check
        run: python -m py_compile app.py test_app.py

      - name: Test analytics worker
        env:
          DUCKDB_ANALYTICS_TOKEN: test-worker-secret-123
        run: python -m unittest discover -s . -p 'test_*.py' -v
