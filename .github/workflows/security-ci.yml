name: Security CI

on:
  push:
    branches: ["main", "hardening/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate
        env:
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVER_KEY: ci-placeholder-not-a-real-secret
        run: pnpm check

  analytics-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: analytics/duckdb-worker
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: analytics/duckdb-worker/requirements.txt

      - name: Install analytics worker dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Syntax check
        run: python -m py_compile app.py test_app.py ../../tests/red-team/security_probe.py

      - name: Test analytics worker
        env:
          DUCKDB_ANALYTICS_TOKEN: test-worker-secret-12345678901234567890
        run: python -m unittest discover -s . -p 'test_*.py' -v

      - name: Test red-team target safety
        run: python -m unittest discover -s ../../tests/red-team -p 'test_*.py' -v
